<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3a5f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Coaching">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Coaching reprise</title>
<style>
:root {
  --fond: #f5f6f8; --carte: #ffffff; --texte: #1b2430; --doux: #5c6878;
  --accent: #1f3a5f; --accent-texte: #ffffff; --bord: #dde2ea;
  --attention: #b26a00; --attention-fond: #fff4e0;
  --alerte: #a31f2b; --alerte-fond: #fde8ea; --ok: #1d7a46;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fond: #111820; --carte: #1a2330; --texte: #e8edf3; --doux: #9aa6b5;
    --accent: #7fb0e6; --accent-texte: #0d1620; --bord: #2a3645;
    --attention: #f0b35a; --attention-fond: #3a2c12;
    --alerte: #ff8590; --alerte-fond: #3d1d22; --ok: #5fd08f;
  }
}
:root[data-theme="dark"] {
  --fond: #111820; --carte: #1a2330; --texte: #e8edf3; --doux: #9aa6b5;
  --accent: #7fb0e6; --accent-texte: #0d1620; --bord: #2a3645;
  --attention: #f0b35a; --attention-fond: #3a2c12;
  --alerte: #ff8590; --alerte-fond: #3d1d22; --ok: #5fd08f;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--fond); color: var(--texte);
  font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; font-size: 16px; }
body { min-height: 100vh; padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
header.top { position: sticky; top: 0; z-index: 5; background: var(--fond);
  padding: calc(12px + env(safe-area-inset-top)) 16px 8px; }
header.top h1 { font-size: 20px; margin: 0; }
header.top p { margin: 2px 0 0; color: var(--doux); font-size: 14px; }
main { padding: 8px 16px 16px; max-width: 640px; margin: 0 auto; }
h2 { font-size: 18px; margin: 20px 0 8px; }
h3 { font-size: 16px; margin: 0 0 6px; }
.carte { background: var(--carte); border: 1px solid var(--bord); border-radius: 14px; padding: 14px; margin: 10px 0; }
.muted { color: var(--doux); font-size: 14px; }
ul.liste { margin: 6px 0 0; padding-left: 20px; }
ul.liste li { margin: 4px 0; }
.alerte { border-radius: 12px; padding: 10px 12px; margin: 8px 0; font-size: 15px; }
.alerte.attention { background: var(--attention-fond); color: var(--attention); }
.alerte.alerte { background: var(--alerte-fond); color: var(--alerte); }
.ligne { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
button, .bouton { font: inherit; border: 0; border-radius: 12px; padding: 12px 16px; min-height: 44px;
  background: var(--accent); color: var(--accent-texte); font-weight: 600; cursor: pointer; }
button.secondaire { background: var(--carte); color: var(--texte); border: 1px solid var(--bord); }
button.danger { background: var(--alerte); color: #fff; }
button.choix { background: var(--carte); color: var(--texte); border: 1px solid var(--bord); padding: 8px 12px; min-height: 40px; font-weight: 500; }
button.choix.actif { background: var(--accent); color: var(--accent-texte); border-color: var(--accent); }
button:disabled { opacity: .5; }
label { display: block; margin: 12px 0 4px; font-size: 14px; color: var(--doux); }
input[type=text], input[type=number], input[type=date], select, textarea {
  width: 100%; font: inherit; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--bord);
  background: var(--carte); color: var(--texte); }
textarea { min-height: 70px; }
.coches label { display: flex; align-items: center; gap: 8px; color: var(--texte); margin: 6px 0; font-size: 16px; }
.coches input { width: 20px; height: 20px; }
.grille { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.stat { background: var(--fond); border-radius: 12px; padding: 10px; }
.stat b { display: block; font-size: 20px; }
.stat span { color: var(--doux); font-size: 13px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
td, th { text-align: left; padding: 8px 4px; border-bottom: 1px solid var(--bord); vertical-align: top; }
tr.actuelle td { color: var(--accent); font-weight: 600; }
nav.bas { position: fixed; bottom: 0; left: 0; right: 0; background: var(--carte); border-top: 1px solid var(--bord);
  display: grid; grid-template-columns: repeat(4, 1fr); padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); z-index: 10; }
nav.bas button { background: none; color: var(--doux); font-weight: 500; font-size: 13px; padding: 6px 0; border-radius: 0; min-height: 52px; }
nav.bas button.actif { color: var(--accent); }
.bandeau { background: var(--attention-fond); color: var(--attention); border-radius: 12px; padding: 10px 12px; margin: 8px 0; font-size: 14px; }
#toast { position: fixed; left: 16px; right: 16px; bottom: calc(90px + env(safe-area-inset-bottom)); background: var(--texte);
  color: var(--fond); padding: 12px 14px; border-radius: 12px; display: none; font-size: 15px; z-index: 20; }
svg.graph { width: 100%; height: auto; display: block; margin-top: 8px; }
svg.graph polyline { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; }
svg.graph line.axe { stroke: var(--bord); stroke-width: 1; }
.hidden { display: none !important; }
</style>
</head>
<body>
<header class="top" id="entete"></header>
<main id="contenu"><p class="muted">Chargement…</p></main>
<nav class="bas hidden" id="navigation">
  <button data-onglet="accueil">Aujourd'hui</button>
  <button data-onglet="programme">Programme</button>
  <button data-onglet="suivi">Suivi</button>
  <button data-onglet="donnees">Données</button>
</nav>
<div id="toast" role="status"></div>
<input type="file" id="fichier-csv" accept=".csv,.txt,text/csv" class="hidden">
<input type="file" id="fichier-json" accept=".json,application/json" class="hidden">
<script src="app.js"></script>
</body>
</html>
